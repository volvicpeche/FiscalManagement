# Local dev/build:  docker compose up --build   (podman-compose up --build)
# Production (VPS): docker compose pull && docker compose up -d
#   IMAGE_TAG picks the version pulled from GHCR; defaults to latest.
#   `build:` is only used when building locally — `pull`/`up -d` on the VPS
#   never touches it, so the VPS needs no copy of the source tree.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/volvicpeche/fiscalmanagement-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - server/.env
    expose:
      - "3000"
    # Saved scenarios are JSON files on disk (services/scenarioStore.ts), not
    # rows in a database. Without this volume every `up -d` replaces the
    # container and takes the user's saved scenarios with it.
    volumes:
      - scenarios:/app/server/data

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: ghcr.io/volvicpeche/fiscalmanagement-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    # Mot de passe du site, jamais commite (voir DEPLOY.md, etape 3c). Sans
    # lui, le conteneur web refuse de demarrer.
    volumes:
      - ./web/htpasswd:/etc/nginx/auth/htpasswd:ro

volumes:
  scenarios:
