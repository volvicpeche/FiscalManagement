server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document reading: uploads up to 10 files of 10 MB, and one model call per
    # file, which takes longer than the default timeout on a large scan.
    location /api/frontalier/documents {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: any non-API, non-file route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
