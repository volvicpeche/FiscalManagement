name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck & build (client, server)
        run: npm run build --workspaces --if-present

      - name: Engine tests
        run: npm test --workspace=server
