name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Scenario storage, per-user isolation and the LLM quota are tested against
    # a real Postgres; without DATABASE_URL those tests are skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patrimonia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patrimonia_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck & build (client, server)
        run: npm run build --workspaces --if-present

      # What a Supabase project already has (auth.users, roles), then the
      # migrations exactly as production applies them.
      - name: Migrate test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/prisma/test/supabase-auth-stub.sql
          npm run db:deploy --workspace=server

      - name: Tests
        run: npm run test:run --workspace=server
